<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Photo Booth">
<meta name="theme-color" content="#0b1620">
<title>Cabina de Fotos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  /* Light blue + white, with gold as the accent metal.
     Every colour is a token so the whole booth re-skins from one block, and a
     dark palette is one attribute away for a dim venue. */
  :root {
    color-scheme: light;
    --ground-1: #f4fbff;
    --ground-2: #cbe7f7;
    --ground-3: #96cde9;
    --ink: #0e3549;
    --ink-soft: rgba(14, 53, 73, .66);
    --surface: rgba(255, 255, 255, .62);
    --surface-2: rgba(255, 255, 255, .9);
    --border: rgba(14, 53, 73, .16);
    --border-on-accent: rgba(255, 255, 255, .75);
    --accent: #2f86bf;
    --accent-ink: #ffffff;
    --secondary: #d3a238;
    --shadow: rgba(14, 53, 73, .22);
    --sheet-bg: #ffffff;
    --input-bg: rgba(14, 53, 73, .06);
    /* The camera screen is always dark, whatever the theme: a photo looks
       right against black, and the controls must never compete with it. */
    --camera-bg: #0b1620;
    --camera-ink: #ffffff;
    --camera-chip: rgba(255, 255, 255, .13);
    --btn-radius: 22px;
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground-1: #0b1f2c;
    --ground-2: #123c55;
    --ground-3: #1b5f83;
    --ink: #ffffff;
    --ink-soft: rgba(255, 255, 255, .68);
    --surface: rgba(255, 255, 255, .12);
    --surface-2: rgba(255, 255, 255, .2);
    --border: rgba(255, 255, 255, .18);
    --accent: #3e9fd6;
    --secondary: #e8bd52;
    --shadow: rgba(0, 0, 0, .5);
    --sheet-bg: #10293a;
    --input-bg: rgba(255, 255, 255, .1);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: ui-rounded, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    background: var(--ground-1);
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }

  #app { position: fixed; inset: 0; }

  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(130% 95% at 10% 0%, var(--ground-1), transparent 58%),
      radial-gradient(120% 90% at 92% 100%, color-mix(in srgb, var(--secondary) 26%, transparent), transparent 62%),
      linear-gradient(168deg, var(--ground-1), var(--ground-2) 52%, var(--ground-3));
  }

  /* The booth is three screens -- welcome, camera, result -- and each one asks
     the guest for exactly one decision. Nothing is ever drawn over the photo
     except the countdown. */
  .screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .hidden { display: none !important; }

  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }

  /* ---------- shared controls ---------- */

  .btn {
    border-radius: var(--btn-radius);
    background: var(--surface-2);
    border: 1.5px solid var(--border);
    padding: 14px 22px;
    font-weight: 800; font-size: clamp(15px, 2.2vh, 19px);
    color: var(--ink);
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    transition: transform .16s ease;
  }
  .btn:active { transform: scale(.96); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--border-on-accent); }
  .btn[disabled] { opacity: .4; pointer-events: none; }

  .pill {
    border-radius: 999px; padding: 9px 18px; font-weight: 800;
    background: var(--surface-2); border: 2px solid var(--border);
    color: var(--ink);
    font-size: clamp(14px, 2.1vh, 18px);
  }
  .pill.on { background: var(--accent); color: var(--accent-ink); border-color: var(--border-on-accent); }

  .icon-btn {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--surface-2); border: 1.5px solid var(--border);
    color: var(--ink);
    display: grid; place-items: center; font-size: 19px; font-weight: 800;
    flex: 0 0 auto;
  }

  /* A square-ish button with an icon over one word. Used wherever the guest
     makes a choice, so every choice in the booth looks like the same thing. */
  .tile {
    flex: 1 1 0; min-width: 0;
    border-radius: 20px;
    background: var(--surface-2); border: 1.5px solid var(--border);
    box-shadow: 0 6px 16px var(--shadow);
    padding: clamp(10px, 1.8vh, 16px) 8px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    font-weight: 800; font-size: clamp(15px, 2.3vh, 20px); line-height: 1.15; text-align: center;
    color: var(--ink);
    transition: transform .16s ease;
  }
  .tile:active { transform: scale(.96); }
  .tile .ico { font-size: clamp(24px, 4vh, 34px); line-height: 1.1; }
  .tile.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--border-on-accent); }
  .tile.ghost { background: var(--surface); box-shadow: none; }
  .tile.wide { flex-direction: row; gap: 12px; padding: clamp(14px, 2.4vh, 20px) 16px; }

  /* ---------- 1. welcome ---------- */

  #attract {
    align-items: center; justify-content: center; text-align: center;
    gap: clamp(6px, 1.6vh, 16px); padding: 24px;
  }
  .celebrant {
    font-family: "Snell Roundhand", "Zapfino", cursive;
    font-weight: 800;
    font-size: clamp(34px, min(11vh, 13vw), 104px);
    line-height: 1.05; margin: 0;
    color: var(--ink);
    text-shadow: 0 4px 18px color-mix(in srgb, var(--ground-3) 60%, transparent);
  }
  .event-date { font-size: clamp(13px, 2.2vh, 22px); letter-spacing: .42em; color: var(--ink-soft); margin: 0; text-transform: uppercase; }
  .ask { font-size: clamp(19px, 3.3vh, 31px); font-weight: 800; margin-top: clamp(2px, 1vh, 10px); }
  .hashtag { font-size: clamp(14px, 2.3vh, 22px); color: color-mix(in srgb, var(--secondary) 78%, var(--ink)); font-weight: 800; }
  .hashtag:empty { display: none; }

  .mode-cards {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: clamp(10px, 2vw, 24px); max-width: min(1120px, 96vw);
  }
  .mode-card {
    width: clamp(138px, 21vw, 250px);
    padding: clamp(14px, 3.2vh, 34px) 10px;
    border-radius: 26px;
    background: var(--surface-2); border: 3px solid transparent;
    box-shadow: 0 12px 30px var(--shadow);
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    color: var(--ink);
    transition: transform .16s ease, border-color .16s ease;
  }
  .mode-card:active { transform: scale(.95); border-color: var(--accent); }
  .mode-card .ico { font-size: clamp(36px, min(8.5vh, 12vw), 84px); line-height: 1.15; }
  .mode-card b { font-size: clamp(17px, min(3vh, 5vw), 28px); line-height: 1.15; }
  .mode-card .hint { font-size: clamp(12px, 1.9vh, 17px); color: var(--ink-soft); font-weight: 600; }

  /* One language at a time, chosen here. Saying everything twice made every
     label half the size it could be. */
  .lang {
    position: absolute; z-index: 2;
    top: max(14px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right));
    display: flex; background: var(--surface-2); border-radius: 999px; padding: 4px;
    box-shadow: 0 4px 14px var(--shadow);
  }
  .lang button { padding: 9px 16px; border-radius: 999px; font-weight: 800; font-size: 15px; color: var(--ink); }
  .lang button.on { background: var(--accent); color: var(--accent-ink); }

  .notice {
    max-width: min(620px, 88vw);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 14px 22px;
    font-size: clamp(13px, 1.9vh, 17px);
    line-height: 1.55; font-weight: 600; text-align: left;
    color: var(--ink);
    box-shadow: 0 8px 20px var(--shadow);
  }
  .notice b { display: block; margin-bottom: 5px; color: var(--accent); font-size: 1.08em; }

  .sparkles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .sparkles i {
    position: absolute; font-style: normal; color: var(--secondary);
    animation: twinkle 2.4s ease-in-out infinite;
  }
  @keyframes twinkle { 0%,100% { opacity: .12; transform: scale(.6) } 50% { opacity: .8; transform: scale(1) } }

  /* Tonight's photos on the welcome screen — the booth advertises itself. */
  .gallery { display: flex; flex-direction: column; gap: 8px; align-items: center; max-width: 94vw; }
  .gallery-label { font-size: clamp(12px, 1.8vh, 16px); font-weight: 700; color: var(--ink-soft); letter-spacing: .04em; }
  .gallery-row { display: flex; gap: 12px; align-items: flex-end; justify-content: center; }
  .gallery-row img {
    /* Strips are 1:3, single photos 4:3. A shared height with auto width keeps
       both readable instead of cropping a strip down to a sliver. */
    height: clamp(70px, 16vh, 160px); width: auto; max-width: 22vw;
    border-radius: 8px; border: 3px solid #fff; object-fit: contain;
    box-shadow: 0 8px 18px var(--shadow);
    animation: riseIn .5s ease both;
  }
  .gallery-row img:nth-child(odd) { transform: rotate(-1.8deg); }
  .gallery-row img:nth-child(even) { transform: rotate(1.6deg); }
  @keyframes riseIn { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }

  /* Operator-facing only: small, cornered, and absent unless something is wrong. */
  .warnings {
    position: absolute; left: 12px; bottom: 12px; z-index: 5;
    display: flex; flex-direction: column; gap: 6px; align-items: flex-start;
    pointer-events: none;
  }
  .warn {
    background: #a8431a; color: #fff; border-radius: 999px;
    padding: 6px 14px; font-size: 13px; font-weight: 700;
    box-shadow: 0 4px 12px rgba(0, 0, 0, .3);
  }

  /* ---------- 2. camera ---------- */

  /* The photo and the controls never overlap. On a landscape tablet the
     controls are a rail beside the photo, where a thumb already is; on a
     portrait phone they sit underneath it. */
  #capture {
    flex-direction: row; gap: 10px;
    background: var(--camera-bg); color: var(--camera-ink);
    padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right))
             max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
  }
  .stage { flex: 1 1 auto; min-width: 0; min-height: 0; position: relative; display: flex; flex-direction: column; gap: 10px; }
  .frame-wrap { flex: 1 1 auto; min-width: 0; min-height: 0; display: grid; place-items: center; overflow: hidden; }

  /* Exactly the picture that will be taken: a 4:3 box, sized by fitBox() to
     the largest that fits. The camera sees more than this, and the rest is
     simply clipped, so the preview never promises more than the photo holds. */
  #frame {
    position: relative; overflow: hidden; background: #000; border-radius: 12px;
    width: 100%; aspect-ratio: 4 / 3; max-height: 100%;
  }
  #video {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%) scaleX(-1);
    display: block; max-width: none;
  }

  #overlay { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; color: #fff; }
  #overlay.dim { background: rgba(0,0,0,.4); }
  #overlay.flash { background: #fff; }
  /* The countdown sits at the top edge, over nobody's face, with no dimming:
     this is the moment guests most need to see themselves. On an iPad the
     top edge is also where the lens is, so it pulls their eyes the right way. */
  #overlay.counting { place-items: start center; padding-top: 10px; }
  #overlay.counting .overlay-stack { gap: 2px; }
  .count {
    font-size: min(20vh, 150px); font-weight: 900; line-height: 1;
    text-shadow: 0 0 34px var(--accent), 0 4px 18px rgba(0,0,0,.5);
    animation: pop .35s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes pop { from { transform: scale(.5); opacity: 0 } to { transform: scale(1); opacity: 1 } }
  .count-caption { font-size: clamp(16px, 3vh, 30px); font-weight: 800; margin-top: 8px; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
  .ring { width: 140px; height: 140px; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 12; stroke-linecap: round; }
  .ring .track { stroke: rgba(255,255,255,.3); }
  .ring .value { stroke: var(--secondary); transition: stroke-dashoffset .1s linear; }
  .overlay-stack { display: grid; place-items: center; gap: 14px; text-align: center; padding: 0 16px; }
  .overlay-stack .big { font-size: clamp(18px, 3.4vh, 32px); font-weight: 800; text-shadow: 0 3px 10px rgba(0,0,0,.65); }

  .rail {
    flex: 0 0 clamp(104px, 12.5vw, 150px);
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    padding: 4px 0;
  }
  .rail-btn {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    color: var(--camera-ink); font-weight: 700; font-size: 13px;
  }
  .rail-btn .ico {
    width: clamp(50px, 7.4vh, 64px); height: clamp(50px, 7.4vh, 64px); border-radius: 50%;
    background: var(--camera-chip); display: grid; place-items: center;
    font-size: clamp(21px, 3.2vh, 27px);
  }
  .rail-btn.on .ico { background: var(--accent); }
  .rail-btn:active .ico { transform: scale(.93); }

  .rail-info { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .mode-chip { text-align: center; font-weight: 800; font-size: 15px; line-height: 1.25; }
  .mode-chip .ico { display: block; font-size: 24px; }
  .mode-chip small { display: block; opacity: .72; font-weight: 600; font-size: 13px; }
  #shots { display: grid; grid-template-columns: repeat(2, auto); gap: 5px; }
  #shots:empty { display: none; }
  #shots img { width: 46px; height: 35px; object-fit: cover; border-radius: 6px; border: 2px solid rgba(255,255,255,.85); display: block; }

  /* The one thing this screen is for. It looks like the shutter on every
     phone camera, so nobody has to be told what it does. */
  .shutter-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: auto 0; }
  .shutter {
    width: clamp(76px, 12vh, 108px); height: clamp(76px, 12vh, 108px);
    border-radius: 50%; border: 5px solid #fff; padding: 6px; background: transparent;
  }
  .shutter .dot { display: block; width: 100%; height: 100%; border-radius: 50%; background: #fff; transition: transform .12s ease; }
  .shutter:active .dot { transform: scale(.88); }
  .shutter.rec .dot { background: #e5484d; }
  .shutter[disabled] { opacity: .32; pointer-events: none; }
  .shoot-label { font-weight: 800; font-size: clamp(13px, 2vh, 16px); text-align: center; }

  /* While the camera is starting or counting, only the picture matters. */
  #capture.shooting .rail-btn, #capture.shooting .shoot-label { visibility: hidden; }
  #capture.shooting .filter-tray { display: none; }

  /* Filters. On a tablet this opens from the rail button, over the bottom
     edge of the photo, only while someone is choosing; the live preview has
     to stay visible or the choice means nothing. */
  .filter-tray {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 3;
    max-width: calc(100% - 24px);
    background: rgba(11, 22, 32, .88); border-radius: 20px; padding: 10px 12px;
    display: none;
  }
  .filter-tray.open { display: block; }
  .row { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; }
  /* Centred while it fits, and starting from its first item once it does
     not. Plain centring pushes the first swatch off the left edge where no
     amount of scrolling can reach it. */
  .row > :first-child { margin-left: auto; }
  .row > :last-child { margin-right: auto; }
  .row::-webkit-scrollbar { display: none; }
  .swatch {
    flex: 0 0 auto; width: clamp(60px, 9vh, 74px);
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    color: var(--camera-ink); font-size: 12.5px; font-weight: 700;
  }
  .swatch .chip {
    width: 100%; aspect-ratio: 4 / 3; border-radius: 12px; border: 3px solid transparent;
    /* A little scene with skin, sky and gold in it, so each filter shows what
       it does to the colours that matter in a party photo. */
    background:
      radial-gradient(circle at 34% 58%, #e8b796 0 22%, transparent 23%),
      radial-gradient(circle at 70% 52%, #b97f5f 0 20%, transparent 21%),
      linear-gradient(160deg, #9fd0f0, #f1e2c4 55%, #d9aa3e);
  }
  .swatch.on .chip { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }

  /* ---------- 3. result ---------- */

  #review {
    flex-direction: row; align-items: stretch;
    gap: clamp(14px, 2.4vw, 30px);
    padding: max(clamp(12px, 2.4vh, 26px), env(safe-area-inset-top)) clamp(12px, 2.6vw, 30px) clamp(12px, 2.4vh, 26px);
  }
  .result-pane { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  /* A one-cell grid whose track is allowed to be smaller than its content:
     that is what lets max-height on the image mean "fit", so the gold border
     hugs the keepsake instead of letterboxing it inside a taller box. */
  .result-photo { flex: 1 1 auto; min-height: 0; width: 100%; display: grid; grid-template: minmax(0, 1fr) / minmax(0, 1fr); place-items: center; }
  #resultImg, #resultVideo {
    display: block; max-width: 100%; max-height: 100%; width: auto; height: auto;
    border-radius: 16px; border: 5px solid var(--secondary);
    box-shadow: 0 16px 40px var(--shadow); background: #fff;
  }
  #resultVideo { background: #000; }

  /* Redo one frame of a strip instead of reshooting all four. */
  .redo-row { flex: 0 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .redo-hint { font-size: clamp(13px, 1.9vh, 16px); color: var(--ink-soft); font-weight: 700; }
  .redo-thumbs { display: flex; gap: 8px; }
  .redo-thumbs button {
    position: relative; overflow: hidden; border-radius: 10px;
    border: 2px solid var(--border); background: var(--surface);
    transition: transform .16s ease;
  }
  .redo-thumbs button:active { transform: scale(.94); }
  .redo-thumbs img { display: block; width: clamp(60px, 9vh, 84px); aspect-ratio: 4 / 3; object-fit: cover; }
  .redo-thumbs .badge, .decor-frame .badge {
    position: absolute; left: 4px; top: 4px; min-width: 20px; height: 20px; padding: 0 5px;
    border-radius: 10px; background: rgba(0,0,0,.62); color: #fff;
    font: 800 12px/20px -apple-system, system-ui, sans-serif; text-align: center;
  }

  .action-pane { flex: 0 0 clamp(250px, 30vw, 360px); display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .action-pane h2 { margin: 0; font-size: clamp(22px, 3.6vh, 34px); line-height: 1.1; text-align: center; }
  .actions { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
  .spacer { flex: 1 1 auto; min-height: 2px; }
  .tile-row { display: flex; gap: 12px; }
  .mini-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .mini {
    border-radius: 999px; padding: 8px 16px; font-weight: 700; font-size: 15px;
    background: var(--surface); border: 1.5px solid var(--border); color: var(--ink);
  }
  .result-note { margin: 0; font-size: 13.5px; font-weight: 600; color: var(--ink-soft); text-align: center; line-height: 1.4; }

  /* How the photo leaves the booth. It is the biggest thing in the column
     because it is the only way a guest gets their picture. */
  .qr-card {
    display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;
    background: var(--surface-2); border: 1.5px solid var(--border);
    border-radius: 22px; padding: clamp(10px, 1.8vh, 16px);
    box-shadow: 0 8px 22px var(--shadow);
  }
  .qr-card .qr { background: #fff; padding: 8px; border-radius: 10px; line-height: 0; }
  .qr-card .qr svg { display: block; width: clamp(120px, 24vh, 210px); height: auto; }
  .qr-card .qr-title { font-weight: 800; font-size: clamp(17px, 2.6vh, 22px); line-height: 1.15; }
  .qr-card .qr-sub { font-size: clamp(13px, 1.8vh, 15px); color: var(--ink-soft); font-weight: 600; }

  /* ---------- editors: props and signing ---------- */

  /* Full screens of their own, not sheets floating over the result. */
  .editor {
    position: absolute; inset: 0; z-index: 20;
    display: flex; gap: clamp(12px, 2vw, 24px);
    padding: max(clamp(12px, 2.2vh, 22px), env(safe-area-inset-top)) clamp(12px, 2.4vw, 26px) clamp(12px, 2.2vh, 22px);
    background: linear-gradient(168deg, var(--ground-1), var(--ground-2) 58%, var(--ground-3));
    color: var(--ink);
  }
  .editor-stage { flex: 1 1 auto; min-width: 0; min-height: 0; display: grid; place-items: center; overflow: hidden; }
  .editor-tools { flex: 0 0 clamp(260px, 31vw, 370px); display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .editor-title { margin: 0; font-size: clamp(20px, 3.2vh, 28px); font-weight: 800; line-height: 1.15; }
  .editor-hint { margin: 0; font-size: 13.5px; font-weight: 600; color: var(--ink-soft); line-height: 1.4; }
  .editor-end { display: flex; gap: 12px; }
  .editor-end .btn { flex: 1 1 0; }

  /* Sized by fitBox(): the photo as large as the space allows, with the prop
     layer covering exactly the photo so a prop sits where it will print. */
  .decor-stage { position: relative; line-height: 0; border-radius: 14px; overflow: hidden;
                 background: #000; box-shadow: 0 12px 34px var(--shadow); width: 100%; aspect-ratio: 4 / 3; }
  #decorImg { display: block; width: 100%; height: 100%; touch-action: none; }
  #decorProps { position: absolute; inset: 0; }

  .prop {
    position: absolute; left: 0; top: 0;
    transform-origin: center center;
    touch-action: none; will-change: transform;
    line-height: 1;
  }
  /* -webkit-user-drag stops iOS lifting the artwork out mid-drag. */
  .prop img { width: 100%; height: 100%; display: block; pointer-events: none;
              -webkit-user-drag: none; user-select: none; }

  .decor-frames { display: flex; gap: 8px; }
  .decor-frames:empty { display: none; }
  .decor-frame {
    position: relative; flex: 1 1 0; max-width: 92px; aspect-ratio: 4 / 3; border-radius: 10px;
    overflow: hidden; background: var(--surface); border: 3px solid var(--border);
  }
  .decor-frame.on { border-color: var(--accent); }
  .decor-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .decor-cats { display: flex; gap: 8px; flex-wrap: wrap; }
  .decor-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
    /* Fixed rows: a tall, thin prop must not stretch its tile. */
    grid-auto-rows: 64px; gap: 8px;
    overflow-y: auto; min-height: 68px; flex: 0 1 auto; padding: 2px;
    scrollbar-width: none;
  }
  .decor-grid::-webkit-scrollbar { display: none; }
  .prop-btn {
    min-width: 0; min-height: 0; overflow: hidden; border-radius: 14px;
    background: var(--surface-2); border: 1.5px solid var(--border);
    font-size: 36px; line-height: 1; display: grid; place-items: center;
  }
  .prop-btn:active { transform: scale(.92); }
  /* Artwork tiles get a tinted ground: a silver tiara on white is invisible. */
  .prop-btn.art { background: linear-gradient(#eef2f8, #dae3ee); }
  .prop-btn img { width: 86%; height: 86%; object-fit: contain;
                  filter: drop-shadow(0 1px 2px rgba(0,0,0,.28)); }
  .decor-more { display: flex; gap: 8px; flex-wrap: wrap; }
  .decor-more .mini.busy { opacity: .55; pointer-events: none; }

  /* Signing: a wide, shallow pad by default, so a finger has room to write. */
  .editor.sign { flex-direction: column; align-items: center; justify-content: center; gap: clamp(10px, 2vh, 18px); }
  .sign-head { display: flex; gap: 14px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .sign-modes { display: flex; gap: 8px; }
  .sign-stage { position: relative; line-height: 0; border-radius: 14px; overflow: hidden; }
  .sign-stage.band { width: min(92vw, 1100px); aspect-ratio: 27 / 8;
                     background: var(--surface-2); border: 2px dashed var(--border); }
  .sign-stage.band img { display: none; }
  .sign-stage.full { width: min(92vw, 1100px); max-height: 56vh; }
  .sign-stage.full img { width: 100%; display: block; }
  .sign-stage.full .sign-hint { display: none; }
  #signCanvas { position: absolute; left: 0; top: 0; width: 100%; touch-action: none; }
  .sign-stage.band #signCanvas { height: 100%; }
  .sign-hint {
    position: absolute; inset: 0; display: grid; place-items: center;
    font: 700 clamp(17px, 3vh, 26px)/1.3 -apple-system, system-ui, sans-serif; color: var(--ink-soft);
    opacity: .5; pointer-events: none;
  }
  .sign-hint.gone { display: none; }
  .sign-scroll { display: flex; gap: 12px; align-items: center; justify-content: center; }
  .sign-pos { font: 700 14px -apple-system, system-ui, sans-serif; color: var(--ink-soft);
              font-variant-numeric: tabular-nums; min-width: 5.5em; text-align: center; }
  .sign-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .sign-colors { display: flex; gap: 8px; margin-right: 6px; }
  .ink { width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--border); }
  .ink.on { border-color: var(--accent); transform: scale(1.12); }

  /* ---------- chrome ---------- */

  #toast {
    position: absolute; left: 50%; bottom: 38px; transform: translateX(-50%); z-index: 40;
    background: var(--ink); color: var(--ground-1); padding: 14px 26px; border-radius: 999px;
    font-weight: 700; font-size: 18px; pointer-events: none; opacity: 0;
    transition: opacity .25s ease; max-width: 80vw; text-align: center;
    box-shadow: 0 10px 26px var(--shadow);
  }
  #toast.show { opacity: 1; }

  /* The operator's way in: a small gear on the welcome screen. Quiet, but
     findable, and the PIN behind it is what keeps guests out. */
  #settingsBtn {
    position: absolute; z-index: 2;
    right: max(14px, env(safe-area-inset-right)); bottom: max(14px, env(safe-area-inset-bottom));
    width: 40px; height: 40px; font-size: 20px; opacity: .55;
  }
  #settingsBtn:active { opacity: 1; }

  /* The operator's other way in, from any screen: press and hold the corner.
     This element is only the dot that shows the hold registering. The hold
     itself is listened for on the document, so nothing here can swallow a tap. */
  #hotcorner {
    position: absolute; left: 0; top: 0; width: 96px; height: 96px;
    z-index: 25; pointer-events: none;
  }
  /* Fills up while held, so the operator can see it registering. */
  #hotcorner::after {
    content: ''; position: absolute; left: 10px; top: 10px; width: 26px; height: 26px;
    border-radius: 50%; background: var(--accent); opacity: 0;
    transform: scale(.3); pointer-events: none;
  }
  #hotcorner.holding::after {
    opacity: .85; transform: scale(1);
    transition: transform 2.6s linear, opacity .25s ease .4s;
  }

  .modal {
    position: absolute; inset: 0; background: color-mix(in srgb, var(--ink) 55%, transparent);
    display: grid; place-items: center; padding: 20px; z-index: 30;
  }
  .sheet {
    background: var(--sheet-bg); border: 1px solid var(--border); border-radius: 22px;
    padding: 22px; width: min(680px, 100%); max-height: 86vh; overflow-y: auto;
    color: var(--ink);
    box-shadow: 0 24px 60px var(--shadow);
  }
  .sheet h2 { margin: 0 0 14px; font-size: 22px; }
  .sheet label { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 9px 0; font-weight: 600; font-size: 15px; }
  .sheet input[type=text], .sheet input[type=number], .sheet input[type=password], .sheet select {
    background: var(--input-bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 9px 12px; color: var(--ink); font: inherit; width: 210px; text-align: right;
  }
  .sheet select { text-align: left; }
  .sheet input[type=checkbox] { width: 24px; height: 24px; accent-color: var(--accent); }
  .sheet .group { border-top: 1px solid var(--border); margin-top: 14px; padding-top: 8px; }
  .sheet .group h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .12em; color: var(--ink-soft); margin: 0 0 4px; }
  .sheet .note { font-size: 12.5px; color: var(--ink-soft); line-height: 1.5; margin: 6px 0 0; }
  .sheet-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }

  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  }

  /* ---------- portrait: phones, or a tablet stood on end ---------- */

  @media (orientation: portrait) {
    /* Welcome: leave the top strip to the language toggle. */
    #attract { padding-top: max(70px, env(safe-area-inset-top)); justify-content: flex-start; }
    .mode-card { width: clamp(138px, 42vw, 250px); padding: clamp(12px, 2.4vh, 26px) 8px; }

    /* Camera: photo on top, filters under it, one row of controls at the
       bottom with the shutter in the middle. */
    #capture { flex-direction: column; }
    .filter-tray, .filter-tray.open {
      position: static; transform: none; display: block; max-width: none;
      background: none; padding: 0; flex: 0 0 auto;
    }
    .rail {
      flex: 0 0 auto; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
      padding: 4px 6px 6px;
    }
    #exitBtn { grid-column: 1; grid-row: 1; justify-self: start; }
    .shutter-wrap { grid-column: 2; grid-row: 1; margin: 0; }
    .rail-info { grid-column: 3; grid-row: 1; justify-self: end; }
    #filterBtn { display: none; }
    .mode-chip { font-size: 13.5px; }
    #shots img { width: 38px; height: 29px; }

    /* Result: photo on top, everything else beneath it. */
    #review { flex-direction: column; }
    .action-pane { flex: 0 0 auto; }
    .action-pane h2 { display: none; }
    .qr-card { flex-direction: row; text-align: left; gap: 14px; }
    .qr-card .qr svg { width: clamp(96px, 26vw, 140px); }

    /* Editors: picture on top, tools beneath. */
    .editor { flex-direction: column; }
    .editor-tools { flex: 0 0 auto; max-height: 56vh; }
    .decor-grid { max-height: 140px; }
    .editor-hint { display: none; }
  }

  /* A phone held sideways: the rail has very little height to work with. */
  @media (orientation: landscape) and (max-height: 480px) {
    .rail { gap: 6px; }
    .mode-chip small, .rail-btn span:not(.ico), .shoot-label { display: none; }
    #shots { display: none; }
  }

  /* AirPrint / Cmd-P prints just the keepsake. */
  @media print {
    body { background: #fff; }
    #app > *:not(#printArea) { display: none !important; }
    #printArea { display: block !important; position: static; }
    #printArea img { max-width: 100%; max-height: 100vh; display: block; margin: 0 auto; }
  }
  #printArea { display: none; }
</style>
</head>
<body>
<div id="app">
  <div class="bg"></div>

  <!-- 1. Welcome: pick what to make. -->
  <section id="attract" class="screen">
    <div class="sparkles" id="sparkles"></div>
    <div class="lang" id="langToggle">
      <button type="button" data-lang="es">Español</button>
      <button type="button" data-lang="en">English</button>
    </div>
    <h1 class="celebrant" id="attractName">Mis Quince</h1>
    <p class="event-date" id="attractDate"></p>
    <div class="ask" data-es="¿Qué quieres hacer?" data-en="What would you like to make?"></div>
    <div class="mode-cards" id="modeCards"></div>
    <div class="hashtag" id="attractTag"></div>
    <div class="gallery hidden" id="gallery">
      <div class="gallery-label" data-es="Fotos de esta noche" data-en="Tonight's photos"></div>
      <div class="gallery-row" id="galleryRow"></div>
    </div>
    <div class="notice hidden" id="cameraNotice">
      <b id="cameraNoticeTitle"></b>
      <span id="cameraNoticeDetail"></span>
    </div>
    <button class="icon-btn" id="settingsBtn" aria-label="Booth settings">⚙</button>
    <div class="warnings hidden" id="warnings"></div>
  </section>

  <!-- 2. Camera: the picture, and one button to take it. -->
  <section id="capture" class="screen hidden">
    <div class="stage" id="stage">
      <div class="frame-wrap" id="frameWrap">
        <div id="frame">
          <video id="video" playsinline muted autoplay></video>
          <div id="overlay"></div>
        </div>
      </div>
      <div class="filter-tray" id="filterTray"><div class="row" id="filterRow"></div></div>
    </div>
    <div class="rail" id="rail">
      <button type="button" class="rail-btn" id="exitBtn">
        <span class="ico">←</span><span data-es="Atrás" data-en="Back"></span>
      </button>
      <div class="rail-info">
        <div class="mode-chip" id="modeChip"></div>
        <div id="shots"></div>
      </div>
      <div class="shutter-wrap">
        <button type="button" class="shutter" id="shootBtn"><span class="dot"></span></button>
        <div class="shoot-label" id="shootLabel"></div>
      </div>
      <button type="button" class="rail-btn" id="filterBtn">
        <span class="ico">🎨</span><span data-es="Filtros" data-en="Filters"></span>
      </button>
    </div>
  </section>

  <!-- 3. Result: the keepsake, how to take it home, and two bits of fun. -->
  <section id="review" class="screen hidden">
    <div class="result-pane">
      <div class="result-photo">
        <img id="resultImg" alt="">
        <video id="resultVideo" class="hidden" playsinline controls></video>
      </div>
      <div class="redo-row hidden" id="redoRow">
        <div class="redo-hint" data-es="¿Repetir una? Tócala" data-en="Redo one? Tap it"></div>
        <div class="redo-thumbs" id="redoThumbs"></div>
      </div>
    </div>
    <div class="action-pane">
      <h2 data-es="¡Quedó preciosa!" data-en="Looking great!"></h2>
      <div class="actions" id="actionPane"></div>
    </div>
  </section>

  <div id="printArea"><img id="printImg" alt=""></div>
  <div id="hotcorner"></div>

  <!-- Props editor. -->
  <section class="editor hidden" id="decorModal">
    <div class="editor-stage" id="decorWrap">
      <div class="decor-stage" id="decorStage">
        <img id="decorImg" alt="">
        <div id="decorProps"></div>
      </div>
    </div>
    <div class="editor-tools">
      <h2 class="editor-title" data-es="Toca una corona" data-en="Tap a crown"></h2>
      <div class="decor-frames" id="decorFrames"></div>
      <div class="decor-cats" id="decorCats"></div>
      <div class="decor-grid" id="decorRow"></div>
      <div class="decor-more">
        <button type="button" class="mini hidden" id="decorAll" data-es="✨ Poner en todas las fotos" data-en="✨ Put on every photo"></button>
        <button type="button" class="mini hidden" id="decorClear" data-es="Quitar todo" data-en="Clear all"></button>
      </div>
      <p class="editor-hint" data-es="Arrastra para mover. Pellizca para agrandar o girar. Toca dos veces para quitar." data-en="Drag to move. Pinch to resize or turn. Double-tap to remove."></p>
      <div class="spacer"></div>
      <div class="editor-end">
        <button type="button" class="btn" id="decorCancel" data-es="Cancelar" data-en="Cancel"></button>
        <button type="button" class="btn primary" id="decorDone" data-es="✓ Listo" data-en="✓ Done"></button>
      </div>
    </div>
  </section>

  <!-- Signing editor. -->
  <section class="editor sign hidden" id="signModal">
    <div class="sign-head">
      <h2 class="editor-title" data-es="Firma con el dedo" data-en="Sign with your finger"></h2>
      <div class="sign-modes">
        <button type="button" class="pill on" id="signModeBand" data-es="En una línea" data-en="On a line"></button>
        <button type="button" class="pill" id="signModeFull" data-es="Sobre la foto" data-en="Over the photo"></button>
      </div>
    </div>
    <div class="sign-stage" id="signStage">
      <img id="signImg" alt="">
      <canvas id="signCanvas"></canvas>
      <div class="sign-hint" id="signHint" data-es="Escribe aquí" data-en="Write here"></div>
    </div>
    <div class="sign-scroll hidden" id="signScroll">
      <button type="button" class="icon-btn" id="signUp" aria-label="Subir">▲</button>
      <span class="sign-pos" id="signPos"></span>
      <button type="button" class="icon-btn" id="signDown" aria-label="Bajar">▼</button>
    </div>
    <div class="sign-tools">
      <div class="sign-colors" id="signColors"></div>
      <button type="button" class="btn" id="signUndo" data-es="↶ Deshacer" data-en="↶ Undo"></button>
      <button type="button" class="btn" id="signClear" data-es="Borrar" data-en="Clear"></button>
      <button type="button" class="btn" id="signCancel" data-es="Cancelar" data-en="Cancel"></button>
      <button type="button" class="btn primary" id="signDone" data-es="✓ Listo" data-en="✓ Done"></button>
    </div>
  </section>

  <div class="modal hidden" id="pinModal">
    <div class="sheet" style="max-width:360px">
      <h2>🔒 Booth settings</h2>
      <label>PIN <input type="password" inputmode="numeric" id="pinInput" style="width:130px"></label>
      <p class="note" id="pinError" style="color:#c0392b; display:none">Wrong PIN</p>
      <div class="sheet-actions">
        <button class="btn" id="pinCancel">Cancel</button>
        <button class="btn primary" id="pinOk">Enter</button>
      </div>
    </div>
  </div>

  <div class="modal hidden" id="adminModal">
    <div class="sheet">
      <h2>Booth settings</h2>
      <div id="adminBody"></div>
      <div class="sheet-actions">
        <button class="btn" id="adminReset">Reset</button>
        <button class="btn primary" id="adminDone">Done</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>
</div>

<script src="qrcode.js"></script>
<script src="gif.js"></script>
<script src="share.js"></script>
<script src="faces.js"></script>
<script src="booth.js"></script>
</body>
</html>
