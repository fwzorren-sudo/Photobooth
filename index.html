<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Photo Booth">
<meta name="theme-color" content="#2a0a1e">
<title>Cabina de Fotos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  /* Light blue + white, with gold as the accent metal.
     Every colour is a token so the whole booth re-skins from one block, and a
     dark palette is one attribute away for a dim venue. */
  :root {
    color-scheme: light;
    --ground-1: #f4fbff;
    --ground-2: #cbe7f7;
    --ground-3: #96cde9;
    --ink: #0e3549;
    --ink-soft: rgba(14, 53, 73, .66);
    --surface: rgba(255, 255, 255, .62);
    --surface-2: rgba(255, 255, 255, .86);
    --border: rgba(14, 53, 73, .16);
    --border-on-accent: rgba(255, 255, 255, .75);
    --accent: #2f86bf;
    --accent-ink: #ffffff;
    --secondary: #d3a238;
    --shadow: rgba(14, 53, 73, .26);
    --sheet-bg: #ffffff;
    --input-bg: rgba(14, 53, 73, .06);
    /* Text that sits on top of the camera image, never on the page ground. */
    --on-media: #ffffff;
    --radius: 28px;
    --btn-radius: 22px;
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground-1: #0b1f2c;
    --ground-2: #123c55;
    --ground-3: #1b5f83;
    --ink: #ffffff;
    --ink-soft: rgba(255, 255, 255, .68);
    --surface: rgba(255, 255, 255, .12);
    --surface-2: rgba(255, 255, 255, .2);
    --border: rgba(255, 255, 255, .18);
    --accent: #3e9fd6;
    --secondary: #e8bd52;
    --shadow: rgba(0, 0, 0, .5);
    --sheet-bg: #10293a;
    --input-bg: rgba(255, 255, 255, .1);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: ui-rounded, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    background: var(--ground-1);
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }

  #app { position: fixed; inset: 0; }

  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(130% 95% at 10% 0%, var(--ground-1), transparent 58%),
      radial-gradient(120% 90% at 92% 100%, color-mix(in srgb, var(--secondary) 26%, transparent), transparent 62%),
      linear-gradient(168deg, var(--ground-1), var(--ground-2) 52%, var(--ground-3));
  }

  .screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .hidden { display: none !important; }

  /* ---------- attract ---------- */

  #attract { align-items: center; justify-content: center; text-align: center; gap: 18px; padding: 28px; }
  #attract .spark { font-size: clamp(40px, 7vh, 76px); animation: breathe 3.2s ease-in-out infinite; }
  .celebrant {
    font-family: "Snell Roundhand", "Zapfino", cursive;
    font-weight: 800;
    font-size: clamp(46px, 13vh, 118px);
    line-height: 1.05;
    margin: 0;
    color: var(--ink);
    text-shadow: 0 4px 18px color-mix(in srgb, var(--ground-3) 60%, transparent);
  }
  .event-date { font-size: clamp(14px, 2.4vh, 24px); letter-spacing: .5em; color: var(--ink-soft); margin: 6px 0 0; text-transform: uppercase; }
  .booth-label { font-size: clamp(16px, 2.8vh, 27px); color: color-mix(in srgb, var(--secondary) 78%, var(--ink)); font-weight: 700; }
  .hashtag { font-size: clamp(15px, 2.6vh, 25px); color: var(--ink-soft); font-weight: 700; }

  .notice {
    max-width: min(620px, 88vw);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 14px 22px;
    font-size: clamp(13px, 1.9vh, 17px);
    line-height: 1.55;
    font-weight: 600;
    text-align: left;
    color: var(--ink);
    box-shadow: 0 8px 20px var(--shadow);
  }
  .notice b { display: block; margin-bottom: 5px; color: var(--accent); font-size: 1.08em; }

  @keyframes breathe { 0%,100% { transform: scale(.92); opacity: .75 } 50% { transform: scale(1.12); opacity: 1 } }

  .sparkles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .sparkles i {
    position: absolute; font-style: normal; color: var(--secondary);
    animation: twinkle 2.4s ease-in-out infinite;
  }
  @keyframes twinkle { 0%,100% { opacity: .12; transform: scale(.6) } 50% { opacity: .8; transform: scale(1) } }

  /* Framing guide: shown only while the guest is getting ready. */
  .guide { position: absolute; inset: 0; pointer-events: none; }
  .guide-oval {
    position: absolute; inset: 7% 19%;
    border: 3px dashed rgba(255, 255, 255, .55);
    border-radius: 50% / 42%;
  }
  .guide-label {
    /* Just inside the top of the oval: the bottom third of the photo area is
       under the floating tray on an iPad, and the middle is where the faces
       are. Up here it is under neither. */
    position: absolute; top: 15%; left: 50%; transform: translateX(-50%);
    background: rgba(0, 0, 0, .48); color: #fff;
    padding: 8px 18px; border-radius: 999px;
    /* It used to be white-space:nowrap sized off vh, so on a narrow preview it
       ran 137px off both sides. Container queries would be the precise tool,
       but container-type adds size containment and collapses this frame, which
       is sized by aspect-ratio against its grid cell. So: cap the width, let
       it wrap, and scale gently with the viewport. */
    font-size: clamp(11px, 2.6vw, 18px); font-weight: 700;
    max-width: 90%; text-align: center; line-height: 1.25;
  }

  /* Tonight's photos on the attract screen — the booth advertises itself. */
  .gallery { display: flex; flex-direction: column; gap: 10px; align-items: center; max-width: 94vw; }
  .gallery-label {
    font-size: clamp(12px, 1.9vh, 17px); font-weight: 700;
    color: var(--ink-soft); letter-spacing: .04em;
  }
  .gallery-row { display: flex; gap: 12px; align-items: flex-end; justify-content: center; flex-wrap: wrap; }
  .gallery-row img {
    /* Strips are 1:3, single photos 4:3. A shared height with auto width keeps
       both readable instead of cropping a strip down to a sliver. */
    height: clamp(96px, 24vh, 250px); width: auto; max-width: 26vw;
    border-radius: 8px; border: 4px solid #fff; object-fit: contain;
    box-shadow: 0 10px 22px var(--shadow);
    animation: riseIn .5s ease both;
  }
  .gallery-row img:nth-child(odd) { transform: rotate(-1.8deg); }
  .gallery-row img:nth-child(even) { transform: rotate(1.6deg); }
  @keyframes riseIn { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }

  /* Operator-facing only: small, cornered, and absent unless something is wrong. */
  .warnings {
    position: absolute; top: 12px; right: 12px; z-index: 5;
    display: flex; flex-direction: column; gap: 6px; align-items: flex-end;
    pointer-events: none;
  }
  .warn {
    background: #a8431a; color: #fff; border-radius: 999px;
    padding: 6px 14px; font-size: 13px; font-weight: 700;
    box-shadow: 0 4px 12px rgba(0, 0, 0, .3);
  }

  /* Signing: draw straight onto the keepsake with a finger. */
  .sign-sheet {
    background: var(--sheet-bg); border-radius: 22px; padding: 16px;
    display: flex; flex-direction: column; gap: 12px; align-items: center;
    max-width: 96vw; max-height: 94vh; box-shadow: 0 24px 60px var(--shadow);
  }
  .sign-modes { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  /* Band mode is the default: a wide, shallow pad that fills the screen, so a
     finger has room to write. Full mode fits the keepsake to the width and
     scrolls, which is still far wider than fitting its height ever was. */
  .sign-stage { position: relative; line-height: 0; border-radius: 10px; overflow: hidden; }
  .sign-stage.band { width: min(88vw, 1100px); aspect-ratio: 27 / 8;
                     background: var(--surface); border: 2px dashed var(--border); }
  .sign-stage.band img { display: none; }
  .sign-stage.full { width: min(88vw, 1100px); max-height: 56vh; }
  .sign-stage.full img { width: 100%; display: block; }
  .sign-stage.full .sign-hint { display: none; }
  #signCanvas { position: absolute; left: 0; top: 0; width: 100%; touch-action: none; }
  .sign-stage.band #signCanvas { height: 100%; }

  .sign-hint {
    position: absolute; inset: 0; display: grid; place-items: center;
    font: 600 clamp(15px, 2.4vh, 22px)/1.3 -apple-system, system-ui, sans-serif; color: var(--ink-soft);
    opacity: .55; pointer-events: none; letter-spacing: .02em;
  }
  .sign-hint.gone { display: none; }

  .sign-scroll { display: flex; gap: 12px; align-items: center; justify-content: center; }
  .sign-pos { font: 600 14px -apple-system, system-ui, sans-serif; color: var(--ink-soft);
              font-variant-numeric: tabular-nums; min-width: 5.5em; text-align: center; }
  .sign-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .sign-colors { display: flex; gap: 8px; }
  .ink {
    width: 38px; height: 38px; border-radius: 50%;
    border: 3px solid var(--border);
  }
  .ink.on { border-color: var(--accent); transform: scale(1.12); }
  .sign-tools .btn { padding: 12px 18px; font-size: 16px; }

  /* ---------- decorate a frame ---------- */

  /* One frame at a time, as large as the sheet allows: props are placed with a
     fingertip, and the strip-sized thumbnails on the review screen are far too
     small to aim at. */
  .decor-sheet { gap: 10px; }
  .decor-stage { position: relative; line-height: 0; border-radius: 12px; overflow: hidden;
                 background: var(--surface); box-shadow: 0 10px 30px var(--shadow); }
  /* Sized off the height, not the width: the thumbnails, pills, prop tray and
     buttons all have to fit under it on a landscape iPad without the sheet
     spilling off the screen. */
  #decorImg { display: block; width: min(84vw, 52vh * 4 / 3); height: auto; touch-action: none; }
  #decorProps { position: absolute; inset: 0; }

  .decor-frames { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .decor-frame {
    position: relative; padding: 0; width: 86px; height: 65px; border-radius: 10px;
    overflow: hidden; background: var(--surface); border: 3px solid var(--border);
  }
  .decor-frame.on { border-color: var(--accent); }
  .decor-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .decor-frame .badge {
    position: absolute; left: 4px; bottom: 4px; min-width: 20px; height: 20px;
    border-radius: 10px; background: rgba(0,0,0,.6); color: #fff;
    font: 700 13px/20px -apple-system, system-ui, sans-serif; text-align: center;
  }

  .decor-cats { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  /* One row that scrolls sideways, so adding props never grows the sheet. */
  .decor-row { display: flex; gap: 10px; flex-wrap: nowrap;
               overflow-x: auto; max-width: min(84vw, 900px); padding: 2px 2px 6px;
               scrollbar-width: none;
               /* `safe` keeps the first tile reachable once the row overflows;
                  browsers without it fall back to the plain centring above. */
               justify-content: center; justify-content: safe center; }
  .decor-row .prop-btn { flex: 0 0 auto; }
  .decor-row::-webkit-scrollbar { display: none; }
  .decor-hint { flex: 1 1 260px; font-size: 13px; font-weight: 600; color: var(--ink-soft);
                line-height: 1.35; text-align: left; }
  .decor-hint span { display: block; opacity: .8; font-weight: 500; }
  /* Detection takes a moment the first time, while the model loads. */
  #decorFit.busy { opacity: .55; }
  #decorFit.busy::after {
    content: ''; width: 13px; height: 13px; margin-left: 8px; border-radius: 50%;
    border: 2px solid var(--border); border-top-color: var(--accent);
    display: inline-block; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg) } }

  /* Video guestbook playback on the review screen. */
  #resultVideo {
    flex: 1 1 auto; min-height: 0;
    max-width: 100%; width: auto;
    border-radius: 18px; border: 4px solid var(--secondary);
    box-shadow: 0 16px 40px var(--shadow); background: #000;
  }

  /* Album QR on the review screen. */
  .album-card {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: var(--btn-radius); padding: 14px;
  }
  .album-card .qr { background: #fff; padding: 8px; border-radius: 10px; line-height: 0; }
  .album-card .qr svg { display: block; width: clamp(118px, 14vw, 168px); height: auto; }
  .album-card .qr-title { font-weight: 700; font-size: clamp(14px, 1.9vh, 18px); color: var(--ink); text-align: center; }
  .album-card .qr-sub { font-size: clamp(11px, 1.5vh, 14px); color: var(--ink-soft); text-align: center; }

  /* Redo one frame of a strip instead of reshooting all four. */
  .redo-row { flex: 0 0 auto; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .redo-hint { font-size: clamp(12px, 1.8vh, 15px); color: var(--ink-soft); font-weight: 600; text-align: center; }
  .redo-thumbs { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .redo-thumbs button {
    position: relative; padding: 0; overflow: hidden; border-radius: 12px;
    border: 2px solid var(--border); background: var(--surface);
    transition: transform .16s ease;
  }
  .redo-thumbs button:active { transform: scale(.94); }
  .redo-thumbs img { display: block; width: 84px; height: 63px; object-fit: cover; }
  .redo-thumbs .badge {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, .58); color: #fff;
    font-size: 11px; font-weight: 700; padding: 3px 0;
  }

  /* ---------- buttons ---------- */

  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

  .btn {
    border-radius: var(--btn-radius);
    background: var(--surface);
    border: 1.5px solid var(--border);
    padding: 16px 24px;
    font-weight: 700;
    color: var(--ink);
    display: flex; align-items: center; gap: 14px;
    transition: transform .16s ease, background .16s ease;
  }
  .btn:active { transform: scale(.96); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--border-on-accent); }
  .btn.huge { font-size: clamp(24px, 4.4vh, 38px); padding: clamp(18px, 3vh, 28px) clamp(30px, 5vw, 56px); }
  /* A single-child flex container needs telling, or the label sits at
     flex-start. The action-pane buttons deliberately do NOT centre. */
  .btn.huge, .btn.shoot { justify-content: center; text-align: center; }
  /* The shutter. Big enough to hit without looking, small enough to leave the
     camera the screen. */
  .btn.shoot {
    flex: 0 0 auto;
    font-size: clamp(19px, 2.6vh, 28px);
    padding: clamp(12px, 1.6vh, 18px) clamp(22px, 3.4vw, 40px);
    box-shadow: 0 6px 20px rgba(0,0,0,.35);
  }
  .btn .sub { display: block; font-size: .55em; opacity: .85; font-weight: 600; }
  .btn[disabled] { opacity: .35; pointer-events: none; }

  .pill {
    border-radius: 999px; padding: 10px 20px; font-weight: 700;
    background: var(--surface); border: 2px solid var(--border);
    color: var(--ink);
    font-size: clamp(13px, 2.1vh, 20px);
  }
  .pill.on { background: var(--accent); color: var(--accent-ink); border-color: var(--border-on-accent); }
  /* English under the Spanish on every guest-facing control. */
  .pill .sub { display: block; font-size: .72em; font-weight: 600; opacity: .8; line-height: 1.15; }

  .icon-btn {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--surface); border: 1.5px solid var(--border);
    color: var(--ink);
    display: grid; place-items: center; font-size: 19px; font-weight: 800;
    flex: 0 0 auto;
  }

  /* ---------- capture ---------- */

  /* The capture screen is the camera. Everything else floats over it. */
  #capture { padding: 0; gap: 0; }

  .frame {
    position: absolute; inset: 0;
    overflow: hidden; background: #000;
    touch-action: none;
  }
  /* The soft backdrop behind the photo area. It used to be a second copy of
     the live stream under a 26px blur, which is a full-screen blur of a video
     every frame -- the single most expensive thing on the page. Now it is a
     32x24 canvas repainted from the preview a few times a second; stretching
     something that small to fill the screen IS a blur, for free. */
  #videoBg {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; transform: scaleX(-1);
    background: #0a1a2a;
  }

  /* Centred and sized by syncCropRegion(), which scales the video so the 4:3
     region that becomes the photo is as large as the screen allows. Whatever
     the sensor sees beyond that spills past the edges as context. */
  #video {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%) scaleX(-1);
    display: block; max-width: none;
  }

  /* The region that actually ends up in the photo. The huge spread shadow dims
     everything outside it without covering it -- props inside stay draggable. */
  #crop {
    position: absolute; left: 0; top: 0;
    outline: 2px solid rgba(255,255,255,.5);
    border-radius: 4px;
    box-shadow: 0 0 0 9999px rgba(0,0,0,.42);
  }

  /* Floating controls. The bar itself ignores taps so the preview stays
     draggable between the buttons; the buttons take them back. */
  .hud { position: absolute; left: 0; right: 0; z-index: 3; display: flex; pointer-events: none;
         transition: opacity .25s ease; }
  /* While the camera is counting or starting, the controls get out of the
     way: the guests need to see themselves, not a tray of filters. */
  .frame.shooting .hud { opacity: 0; pointer-events: none !important; }
  .frame.shooting .hud > *, .frame.shooting .hud button { pointer-events: none; }
  .hud > *, .hud button { pointer-events: auto; }
  .hud-top {
    top: 0; align-items: center; gap: 10px;
    padding: max(8px, env(safe-area-inset-top)) 12px 26px;
    background: linear-gradient(rgba(0,0,0,.6), rgba(0,0,0,0));
  }
  .hud-bottom {
    bottom: 0; flex-direction: column; gap: 8px;
    padding: 30px 12px max(10px, env(safe-area-inset-bottom));
    background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.66) 42%);
  }
  .hud-foot { display: flex; align-items: center; gap: 14px; justify-content: flex-end; }
  .hud-foot .hint { flex: 1 1 auto; min-width: 0; color: rgba(255,255,255,.82); font-size: 12px; }
  .hud-foot .hint .sub { display: block; opacity: .8; }

  /* Chrome over video has to be light-on-dark, whatever the theme. */
  /* No backdrop-filter here on purpose: thirty of them over live video is a
     thirty-layer blur per frame on a tablet GPU. A slightly denser tint reads
     just as well. */
  .hud .pill, .hud .swatch, .hud .prop-btn, .hud .icon-btn {
    background: rgba(20,30,40,.55); color: #fff;
    border-color: rgba(255,255,255,.32);
  }
  .hud .pill.on, .hud .swatch.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .hud .prop-btn.art { background: rgba(255,255,255,.82); }
  .hud .icon-btn { background: rgba(0,0,0,.5); }

  .hud .modes {
    display: flex; gap: 8px; flex: 1 1 auto; min-width: 0; flex-wrap: nowrap;
    overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
    justify-content: center; justify-content: safe center;
  }
  .hud .modes::-webkit-scrollbar { display: none; }
  .hud .modes .pill { flex: 0 0 auto; }

  /* Inside #crop: prop coordinates are normalised to the CAPTURED frame,
     so they have to live in the region that gets captured. */
  #props { position: absolute; inset: 0; }
  #crop .guide { position: absolute; inset: 0; }
  .prop {
    position: absolute; left: 0; top: 0;
    transform-origin: center center;
    touch-action: none;
    will-change: transform;
    line-height: 1;
  }
  /* Artwork props: the node is already sized to the art's aspect ratio, so the
     image just fills it. -webkit-user-drag stops iOS lifting it out mid-drag. */
  .prop img { width: 100%; height: 100%; display: block; pointer-events: none;
              -webkit-user-drag: none; user-select: none; }

  /* Only visible mid-strip, when the bottom bar is hidden, so it lives there. */
  #shots { position: absolute; bottom: max(12px, env(safe-area-inset-bottom)); right: 12px; display: flex; gap: 8px; pointer-events: none; }
  #shots img { width: 68px; height: 51px; object-fit: cover; border-radius: 8px; border: 2px solid rgba(255,255,255,.9); }

  #overlay { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; color: var(--on-media); }
  #overlay.dim { background: rgba(0,0,0,.32); }
  #overlay.flash { background: #fff; }
  /* The countdown sits at the top edge, over nobody's face, with no dimming:
     this is the moment guests most need to see themselves. On an iPad the
     top edge is also where the lens is, so it pulls their eyes the right way. */
  #overlay.counting {
    place-items: start center;
    padding-top: max(10px, env(safe-area-inset-top));
  }
  #overlay.counting .overlay-stack { gap: 2px; }
  .count {
    font-size: min(20vh, 150px); font-weight: 900; line-height: 1;
    text-shadow: 0 0 34px var(--accent), 0 4px 18px rgba(0,0,0,.5);
    animation: pop .35s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes pop { from { transform: scale(.5); opacity: 0 } to { transform: scale(1); opacity: 1 } }
  .count-caption { font-size: clamp(16px, 3vh, 30px); font-weight: 700; margin-top: 8px; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
  .ring { width: 140px; height: 140px; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 12; stroke-linecap: round; }
  .ring .track { stroke: rgba(255,255,255,.3); }
  .ring .value { stroke: var(--secondary); transition: stroke-dashoffset .1s linear; }
  .overlay-stack { display: grid; place-items: center; gap: 14px; text-align: center; }
  .overlay-stack .big { font-size: clamp(18px, 3.4vh, 32px); font-weight: 800; text-shadow: 0 3px 10px rgba(0,0,0,.65); }


  .row { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .row::-webkit-scrollbar { display: none; }

  .swatch {
    flex: 0 0 auto; width: 76px; height: 62px; border-radius: 14px;
    background: var(--surface); border: 2px solid var(--border);
    color: var(--ink);
    display: grid; place-items: center; gap: 2px; font-size: 14px; font-weight: 700;
  }
  .swatch .emoji { font-size: 26px; }
  .swatch .sub { display: block; font-size: .78em; font-weight: 600; opacity: .8; line-height: 1.15; }
  .swatch.on { background: var(--accent); color: var(--accent-ink); border-color: var(--border-on-accent); }

  .prop-btn {
    flex: 0 0 auto; width: 56px; height: 56px; border-radius: 14px;
    background: var(--surface); border: 1.5px solid var(--border);
    font-size: 42px; display: grid; place-items: center;
  }
  /* Artwork tiles get a tinted ground: a silver tiara on white is invisible. */
  .prop-btn.art { background: linear-gradient(#eef2f8, #dae3ee); }
  .prop-btn img { max-width: 92%; max-height: 92%; object-fit: contain;
                  filter: drop-shadow(0 1px 2px rgba(0,0,0,.28)); }
  .tray-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .hint { font-size: 13px; color: var(--ink-soft); font-weight: 600; }

  /* ---------- review ---------- */

  #review { flex-direction: row; gap: 26px; padding: 18px clamp(14px, 3vw, 34px); align-items: stretch; }
  .result-pane { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-width: 0; min-height: 0; overflow: hidden; }
  .result-pane h2 { margin: 0; font-size: clamp(22px, 4vh, 38px); color: var(--ink); }
  .result-pane h2 .sub { display: block; margin: 4px 0 0; color: var(--ink-soft); font-size: clamp(13px, 2vh, 19px); font-weight: 400; }
  #resultImg {
    /* Grows into whatever the heading and redo row leave, rather than
       sitting small in the middle of empty space. min-height:0 is what lets
       it shrink below its intrinsic size instead of overflowing. */
    flex: 1 1 auto; min-height: 0;
    max-width: 100%; width: auto;
    border-radius: 18px; object-fit: contain;
    border: 4px solid var(--secondary);
    box-shadow: 0 16px 40px var(--shadow); background: #fff;
  }
  .action-pane { flex: 0 0 clamp(260px, 32vw, 380px); display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
  .action-pane .btn { width: 100%; }
  .spacer { flex: 1 1 auto; min-height: 4px; }

  /* ---------- chrome ---------- */

  #toast {
    position: absolute; left: 50%; bottom: 38px; transform: translateX(-50%);
    background: var(--ink); color: var(--ground-1); padding: 14px 26px; border-radius: 999px;
    font-weight: 700; font-size: 18px; pointer-events: none; opacity: 0;
    transition: opacity .25s ease; max-width: 80vw; text-align: center;
    box-shadow: 0 10px 26px var(--shadow);
  }
  #toast.show { opacity: 1; }

  /* The operator's other way in: a small gear on the welcome screen. Quiet,
     but findable, and the PIN behind it is what keeps guests out. */
  #settingsBtn {
    position: absolute; z-index: 2;
    right: max(14px, env(safe-area-inset-right)); bottom: max(14px, env(safe-area-inset-bottom));
    width: 40px; height: 40px; font-size: 20px; opacity: .55;
  }
  #settingsBtn:active { opacity: 1; }

  /* The operator's way in: press and hold. It sits above the screens so it
     works from any of them, but BELOW the topbar -- at 96px square it used to
     cover the close button and swallow every tap meant for it. */
  #hotcorner {
    position: absolute; left: 0; top: 0; width: 112px; height: 112px;
    z-index: 1; touch-action: none; -webkit-touch-callout: none;
  }
  /* Fills up while held, so the operator can see it registering instead of
     guessing for three seconds. Invisible until the hold is clearly deliberate. */
  #hotcorner::after {
    content: ''; position: absolute; left: 10px; top: 10px; width: 26px; height: 26px;
    border-radius: 50%; background: var(--accent); opacity: 0;
    transform: scale(.3); pointer-events: none;
  }
  #hotcorner.holding::after {
    opacity: .85; transform: scale(1);
    transition: transform 2.6s linear, opacity .25s ease .4s;
  }

  .modal {
    position: absolute; inset: 0; background: color-mix(in srgb, var(--ink) 55%, transparent);
    display: grid; place-items: center; padding: 20px; z-index: 20;
    backdrop-filter: blur(6px);
  }
  .sheet {
    background: var(--sheet-bg); border: 1px solid var(--border); border-radius: 22px;
    padding: 22px; width: min(680px, 100%); max-height: 86vh; overflow-y: auto;
    color: var(--ink);
    box-shadow: 0 24px 60px var(--shadow);
  }
  .sheet h2 { margin: 0 0 14px; font-size: 22px; }
  .sheet label { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 9px 0; font-weight: 600; font-size: 15px; }
  .sheet input[type=text], .sheet input[type=number], .sheet input[type=password], .sheet select {
    background: var(--input-bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 9px 12px; color: var(--ink); font: inherit; width: 210px; text-align: right;
  }
  .sheet select { text-align: left; }
  .sheet input[type=checkbox] { width: 24px; height: 24px; accent-color: var(--accent); }
  .sheet .group { border-top: 1px solid var(--border); margin-top: 14px; padding-top: 8px; }
  .sheet .group h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .12em; color: var(--ink-soft); margin: 0 0 4px; }
  .sheet .note { font-size: 12.5px; color: var(--ink-soft); line-height: 1.5; margin: 6px 0 0; }
  .sheet-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }

  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  }

  /* Portrait fallback: the booth is designed landscape, but never break. */
  /* Phones. The booth is for an iPad, but this screen used to collapse
     completely on anything narrow: the four mode pills wrapped to four rows
     and ate 240px, leaving the camera preview 62x47 on an iPhone. The preview
     is the entire point of this screen, so here it gets a floor and everything
     else gets out of its way. */
  @media (max-width: 620px) {
    .hud-top { gap: 8px; padding-bottom: 20px; }
    .hud-bottom { gap: 6px; padding-bottom: max(8px, env(safe-area-inset-bottom)); }
    .hud .icon-btn { width: 36px; height: 36px; font-size: 17px; }
    .hud .modes .pill { padding: 6px 11px; font-size: 14px; }
    .pill { padding: 7px 12px; font-size: 14px; }
    .swatch { width: 66px; height: 54px; font-size: 12px; }
    .swatch .emoji { font-size: 19px; }
    .prop-btn { width: 50px; height: 50px; font-size: 28px; }
    /* No room for instructions; the gestures are discoverable by touching a
       prop. With the hint gone the shutter centres, as a camera's should. */
    .hud-foot .hint { display: none; }
    .hud-foot { justify-content: center; }
    .btn.shoot { font-size: 18px; padding: 11px 22px; }
    #shots img { width: 52px; height: 39px; }
    #propCats {
      flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    #propCats::-webkit-scrollbar { display: none; }
    #propCats .pill { flex: 0 0 auto; }
  }

  @media (orientation: portrait) {
    #review { flex-direction: column; }
    .action-pane { flex: 0 0 auto; flex-direction: row; flex-wrap: wrap; }
    .action-pane .btn { width: auto; flex: 1 1 42%; }
  }

  /* AirPrint / Cmd-P prints just the keepsake. */
  @media print {
    body { background: #fff; }
    #app > *:not(#printArea) { display: none !important; }
    #printArea { display: block !important; position: static; }
    #printArea img { max-width: 100%; max-height: 100vh; display: block; margin: 0 auto; }
  }
  #printArea { display: none; }
</style>
</head>
<body>
<div id="app">
  <div class="bg"></div>

  <section id="attract" class="screen">
    <div class="sparkles" id="sparkles"></div>
    <div class="spark">✨</div>
    <h1 class="celebrant" id="attractName">Mis Quince</h1>
    <p class="event-date" id="attractDate"></p>
    <div class="booth-label" data-line data-es="Cabina de Fotos" data-en="Photo Booth"></div>
    <button class="btn primary huge" id="startBtn">
      <span>📸</span>
      <span data-es="¡Toca para empezar!" data-en="Tap to start"></span>
    </button>
    <div class="hashtag" id="attractTag"></div>
    <button class="icon-btn" id="settingsBtn" aria-label="Booth settings">⚙</button>
    <div class="gallery hidden" id="gallery">
      <div class="gallery-label" data-line data-es="Fotos de esta noche" data-en="Tonight's photos"></div>
      <div class="gallery-row" id="galleryRow"></div>
    </div>
    <div class="warnings hidden" id="warnings"></div>
    <div class="notice hidden" id="cameraNotice">
      <b id="cameraNoticeTitle"></b>
      <span id="cameraNoticeDetail"></span>
    </div>
  </section>

  <section id="capture" class="screen hidden">
    <!-- The camera fills the screen and everything else floats over it. The
         guest is here to look at themselves; the controls are secondary. -->
    <div class="frame" id="frame">
      <!-- The same stream, blurred, filling whatever the photo area does not.
           A 4:3 photo on a tall screen otherwise leaves hard black bands. -->
      <canvas id="videoBg" width="32" height="24" aria-hidden="true"></canvas>
      <video id="video" playsinline muted autoplay></video>

      <!-- Exactly the region that ends up in the photo. The capture is a 4:3
           centre crop of the camera, so on a screen of any other shape a
           full-bleed preview would promise something it does not deliver.
           Sized from the real video dimensions in syncCropRegion(). -->
      <div id="crop">
        <div class="guide hidden" id="guide">
          <div class="guide-oval"></div>
          <div class="guide-label" data-line data-es="Colócate aquí" data-en="Stand here"></div>
        </div>
        <div id="props"></div>
      </div>

      <div id="shots"></div>
      <div id="overlay"></div>

      <div class="hud hud-top">
        <button class="icon-btn" id="exitBtn" aria-label="Salir">✕</button>
        <div class="modes" id="modeRow"></div>
      </div>

      <div class="hud hud-bottom">
        <div class="tray-head" id="propCats"></div>
        <div class="row" id="filterRow"></div>
        <div class="row" id="propRow"></div>
        <div class="hud-foot">
          <div class="hint" id="propHint" data-es="Arrastra · pellizca · toca dos veces para quitar" data-en="Drag · pinch · double-tap to remove"></div>
          <button class="btn primary shoot" id="shootBtn">
            <span id="shootLabel"></span>
          </button>
        </div>
      </div>
    </div>
  </section>

  <section id="review" class="screen hidden">
    <div class="result-pane">
      <h2 data-es="¡Quedó preciosa!" data-en="Looking gorgeous"></h2>
      <img id="resultImg" alt="Tu foto">
      <video id="resultVideo" class="hidden" playsinline controls></video>
      <div class="redo-row hidden" id="redoRow">
        <div class="redo-hint" data-line data-es="¿Salió mal una? Tócala para repetirla" data-en="Tap one to redo just that shot"></div>
        <div class="redo-thumbs" id="redoThumbs"></div>
      </div>
    </div>
    <div class="action-pane" id="actionPane"></div>
  </section>

  <div id="printArea"><img id="printImg" alt=""></div>
  <div id="toast"></div>
  <div id="hotcorner"></div>

  <div class="modal hidden" id="signModal">
    <div class="sign-sheet">
      <div class="sign-modes">
        <button class="pill on" id="signModeBand" data-es="✍️ Firma" data-en="✍️ Sign a line"></button>
        <button class="pill" id="signModeFull" data-es="🎞️ Toda la tira" data-en="🎞️ Whole strip"></button>
      </div>
      <div class="sign-stage" id="signStage">
        <img id="signImg" alt="">
        <canvas id="signCanvas"></canvas>
        <div class="sign-hint" id="signHint" data-line data-es="Escribe aquí" data-en="Write here"></div>
      </div>
      <div class="sign-scroll hidden" id="signScroll">
        <button class="icon-btn" id="signUp" aria-label="Subir">▲</button>
        <span class="sign-pos" id="signPos"></span>
        <button class="icon-btn" id="signDown" aria-label="Bajar">▼</button>
      </div>
      <div class="sign-tools">
        <div class="sign-colors" id="signColors"></div>
        <button class="btn" id="signUndo" data-es="↶ Deshacer" data-en="↶ Undo"></button>
        <button class="btn" id="signClear" data-es="Limpiar" data-en="Clear"></button>
        <button class="btn" id="signCancel" data-es="Cancelar" data-en="Cancel"></button>
        <button class="btn primary" id="signDone" data-es="✓ Listo" data-en="✓ Done"></button>
      </div>
    </div>
  </div>

  <div class="modal hidden" id="decorModal">
    <div class="sign-sheet decor-sheet">
      <div class="decor-frames" id="decorFrames"></div>
      <div class="decor-stage" id="decorStage">
        <img id="decorImg" alt="">
        <div id="decorProps"></div>
      </div>
      <div class="decor-cats" id="decorCats"></div>
      <div class="decor-row" id="decorRow"></div>
      <div class="sign-tools">
        <div class="decor-hint" data-es="Arrastra para mover · pellizca para girar · toca dos veces para quitar" data-en="Drag to move · pinch to resize and spin · double-tap to remove"></div>
        <button class="btn" id="decorFit" data-es="✨ A la cara" data-en="✨ Fit to face"></button>
        <button class="btn" id="decorCancel" data-es="Cancelar" data-en="Cancel"></button>
        <button class="btn primary" id="decorDone" data-es="✓ Listo" data-en="✓ Done"></button>
      </div>
    </div>
  </div>

  <div class="modal hidden" id="pinModal">
    <div class="sheet" style="max-width:360px">
      <h2>🔒 Booth settings</h2>
      <label>PIN <input type="password" inputmode="numeric" id="pinInput" style="width:130px"></label>
      <p class="note" id="pinError" style="color:#c0392b; display:none">Wrong PIN</p>
      <div class="sheet-actions">
        <button class="btn" id="pinCancel">Cancel</button>
        <button class="btn primary" id="pinOk">Enter</button>
      </div>
    </div>
  </div>

  <div class="modal hidden" id="adminModal">
    <div class="sheet">
      <h2>Booth settings</h2>
      <div id="adminBody"></div>
      <div class="sheet-actions">
        <button class="btn" id="adminReset">Reset</button>
        <button class="btn primary" id="adminDone">Done</button>
      </div>
    </div>
  </div>
</div>

<script src="qrcode.js"></script>
<script src="gif.js"></script>
<script src="share.js"></script>
<script src="faces.js"></script>
<script src="booth.js"></script>
</body>
</html>
