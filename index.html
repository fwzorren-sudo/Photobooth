<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Photo Booth">
<meta name="theme-color" content="#2a0a1e">
<title>Cabina de Fotos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    color-scheme: dark;
    --accent: #e6338c;
    --secondary: #f2c230;
    --ink: #ffffff;
    --radius: 28px;
    --btn-radius: 22px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: ui-rounded, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    background: #1b0713;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }

  #app { position: fixed; inset: 0; }

  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(120% 90% at 12% 0%, color-mix(in srgb, var(--accent) 55%, transparent), transparent 62%),
      radial-gradient(110% 90% at 92% 100%, color-mix(in srgb, var(--secondary) 40%, transparent), transparent 60%),
      linear-gradient(168deg, #1b0713, #43102f 48%, #6d1546);
  }

  .screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .hidden { display: none !important; }

  /* ---------- attract ---------- */

  #attract { align-items: center; justify-content: center; text-align: center; gap: 18px; padding: 28px; }
  #attract .spark { font-size: clamp(40px, 7vh, 76px); animation: breathe 3.2s ease-in-out infinite; }
  .celebrant {
    font-family: "Snell Roundhand", "Zapfino", cursive;
    font-weight: 800;
    font-size: clamp(46px, 13vh, 118px);
    line-height: 1.05;
    margin: 0;
    text-shadow: 0 6px 22px rgba(0,0,0,.45);
  }
  .event-date { font-size: clamp(14px, 2.4vh, 24px); letter-spacing: .5em; opacity: .9; margin: 6px 0 0; text-transform: uppercase; }
  .booth-label { font-size: clamp(16px, 2.8vh, 27px); color: var(--secondary); font-weight: 700; }
  .hashtag { font-size: clamp(15px, 2.6vh, 25px); opacity: .82; font-weight: 700; }

  .notice {
    max-width: min(620px, 88vw);
    background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.22);
    border-radius: 18px;
    padding: 14px 22px;
    font-size: clamp(13px, 1.9vh, 17px);
    line-height: 1.55;
    font-weight: 600;
    text-align: left;
  }
  .notice b { display: block; margin-bottom: 5px; color: var(--secondary); font-size: 1.08em; }

  @keyframes breathe { 0%,100% { transform: scale(.92); opacity: .75 } 50% { transform: scale(1.12); opacity: 1 } }

  .sparkles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .sparkles i {
    position: absolute; font-style: normal; color: var(--secondary);
    animation: twinkle 2.4s ease-in-out infinite;
  }
  @keyframes twinkle { 0%,100% { opacity: .12; transform: scale(.6) } 50% { opacity: .9; transform: scale(1) } }

  /* ---------- buttons ---------- */

  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

  .btn {
    border-radius: var(--btn-radius);
    background: rgba(255,255,255,.14);
    border: 1.5px solid rgba(255,255,255,.24);
    padding: 16px 24px;
    font-weight: 700;
    display: flex; align-items: center; gap: 14px;
    transition: transform .16s ease, background .16s ease;
  }
  .btn:active { transform: scale(.96); }
  .btn.primary { background: var(--accent); border-color: rgba(255,255,255,.3); }
  .btn.huge { font-size: clamp(24px, 4.4vh, 38px); padding: clamp(18px, 3vh, 28px) clamp(30px, 5vw, 56px); }
  .btn .sub { display: block; font-size: .55em; opacity: .85; font-weight: 600; }
  .btn[disabled] { opacity: .35; pointer-events: none; }

  .pill {
    border-radius: 999px; padding: 10px 20px; font-weight: 700;
    background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.12);
    font-size: clamp(13px, 2.1vh, 20px);
  }
  .pill.on { background: var(--accent); border-color: rgba(255,255,255,.7); }

  .icon-btn {
    width: 48px; height: 48px; border-radius: 50%;
    background: rgba(255,255,255,.14);
    display: grid; place-items: center; font-size: 22px; font-weight: 800;
  }

  /* ---------- capture ---------- */

  #capture { padding: 14px clamp(12px, 2.4vw, 28px); gap: 12px; }

  .topbar { display: flex; align-items: center; gap: 14px; flex: 0 0 auto; }
  .topbar .modes { display: flex; gap: 10px; margin: 0 auto; flex-wrap: wrap; justify-content: center; }

  .stage { flex: 1 1 auto; display: grid; place-items: center; min-height: 0; }

  .frame {
    position: relative;
    aspect-ratio: 4 / 3;
    max-height: 100%; max-width: 100%;
    border-radius: var(--radius);
    border: 5px solid color-mix(in srgb, var(--secondary) 80%, transparent);
    overflow: hidden;
    background: #000;
    box-shadow: 0 18px 44px rgba(0,0,0,.5);
    touch-action: none;
  }
  #video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }

  #props { position: absolute; inset: 0; }
  .prop {
    position: absolute; left: 0; top: 0;
    transform-origin: center center;
    touch-action: none;
    will-change: transform;
    line-height: 1;
  }

  #shots { position: absolute; top: 12px; right: 12px; display: flex; gap: 8px; pointer-events: none; }
  #shots img { width: 68px; height: 51px; object-fit: cover; border-radius: 8px; border: 2px solid rgba(255,255,255,.85); }

  #overlay { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
  #overlay.dim { background: rgba(0,0,0,.3); }
  #overlay.flash { background: #fff; }
  .count {
    font-size: min(34vh, 220px); font-weight: 900; line-height: 1;
    text-shadow: 0 0 34px var(--accent);
    animation: pop .35s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes pop { from { transform: scale(.5); opacity: 0 } to { transform: scale(1); opacity: 1 } }
  .count-caption { font-size: clamp(16px, 3vh, 30px); font-weight: 700; margin-top: 8px; }
  .ring { width: 140px; height: 140px; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 12; stroke-linecap: round; }
  .ring .track { stroke: rgba(255,255,255,.25); }
  .ring .value { stroke: var(--accent); transition: stroke-dashoffset .1s linear; }
  .overlay-stack { display: grid; place-items: center; gap: 14px; text-align: center; }
  .overlay-stack .big { font-size: clamp(18px, 3.4vh, 32px); font-weight: 800; text-shadow: 0 3px 10px rgba(0,0,0,.6); }

  .controls { flex: 0 0 auto; display: flex; align-items: flex-end; gap: 20px; }
  .control-stack { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 10px; }

  .row { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .row::-webkit-scrollbar { display: none; }

  .swatch {
    flex: 0 0 auto; width: 104px; height: 74px; border-radius: 18px;
    background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.14);
    display: grid; place-items: center; gap: 2px; font-size: 14px; font-weight: 700;
  }
  .swatch .emoji { font-size: 28px; }
  .swatch.on { background: var(--accent); border-color: rgba(255,255,255,.7); }

  .prop-btn {
    flex: 0 0 auto; width: 70px; height: 70px; border-radius: 18px;
    background: rgba(255,255,255,.14); font-size: 42px; display: grid; place-items: center;
  }
  .tray-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .hint { font-size: 13px; opacity: .6; font-weight: 600; }

  /* ---------- review ---------- */

  #review { flex-direction: row; gap: 26px; padding: 18px clamp(14px, 3vw, 34px); align-items: stretch; }
  .result-pane { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-width: 0; }
  .result-pane h2 { margin: 0; font-size: clamp(22px, 4vh, 38px); }
  .result-pane .sub { margin: 0; opacity: .7; font-size: clamp(13px, 2vh, 19px); }
  #resultImg {
    max-height: 68vh; max-width: 100%; border-radius: 18px; object-fit: contain;
    border: 4px solid color-mix(in srgb, var(--secondary) 85%, transparent);
    box-shadow: 0 16px 40px rgba(0,0,0,.5); background: #000;
  }
  .action-pane { flex: 0 0 clamp(260px, 32vw, 380px); display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
  .action-pane .btn { width: 100%; }
  .spacer { flex: 1 1 auto; min-height: 4px; }

  /* ---------- chrome ---------- */

  #toast {
    position: absolute; left: 50%; bottom: 38px; transform: translateX(-50%);
    background: rgba(0,0,0,.8); padding: 14px 26px; border-radius: 999px;
    font-weight: 700; font-size: 18px; pointer-events: none; opacity: 0;
    transition: opacity .25s ease; max-width: 80vw; text-align: center;
  }
  #toast.show { opacity: 1; }

  #hotcorner { position: absolute; left: 0; top: 0; width: 96px; height: 96px; }

  .modal {
    position: absolute; inset: 0; background: rgba(0,0,0,.72);
    display: grid; place-items: center; padding: 20px; z-index: 20;
    backdrop-filter: blur(6px);
  }
  .sheet {
    background: #241021; border: 1px solid rgba(255,255,255,.16); border-radius: 22px;
    padding: 22px; width: min(680px, 100%); max-height: 86vh; overflow-y: auto;
  }
  .sheet h2 { margin: 0 0 14px; font-size: 22px; }
  .sheet label { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 9px 0; font-weight: 600; font-size: 15px; }
  .sheet input[type=text], .sheet input[type=number], .sheet input[type=password] {
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18);
    border-radius: 10px; padding: 9px 12px; color: #fff; font: inherit; width: 210px; text-align: right;
  }
  .sheet input[type=checkbox] { width: 24px; height: 24px; accent-color: var(--accent); }
  .sheet .group { border-top: 1px solid rgba(255,255,255,.12); margin-top: 14px; padding-top: 8px; }
  .sheet .group h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .12em; opacity: .6; margin: 0 0 4px; }
  .sheet .note { font-size: 12.5px; opacity: .62; line-height: 1.5; margin: 6px 0 0; }
  .sheet-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }

  /* Portrait fallback: the booth is designed landscape, but never break. */
  @media (orientation: portrait) {
    #review { flex-direction: column; }
    .action-pane { flex: 0 0 auto; flex-direction: row; flex-wrap: wrap; }
    .action-pane .btn { width: auto; flex: 1 1 42%; }
    .controls { flex-direction: column; align-items: stretch; }
  }

  /* AirPrint / Cmd-P prints just the keepsake. */
  @media print {
    body { background: #fff; }
    #app > *:not(#printArea) { display: none !important; }
    #printArea { display: block !important; position: static; }
    #printArea img { max-width: 100%; max-height: 100vh; display: block; margin: 0 auto; }
  }
  #printArea { display: none; }
</style>
</head>
<body>
<div id="app">
  <div class="bg"></div>

  <section id="attract" class="screen">
    <div class="sparkles" id="sparkles"></div>
    <div class="spark">✨</div>
    <h1 class="celebrant" id="attractName">Mis Quince</h1>
    <p class="event-date" id="attractDate"></p>
    <div class="booth-label">Cabina de Fotos · Photo Booth</div>
    <button class="btn primary huge" id="startBtn">
      <span>📸</span>
      <span>¡Toca para empezar!<span class="sub">Tap to start</span></span>
    </button>
    <div class="hashtag" id="attractTag"></div>
    <div class="notice hidden" id="cameraNotice">
      <b id="cameraNoticeTitle"></b>
      <span id="cameraNoticeDetail"></span>
    </div>
  </section>

  <section id="capture" class="screen hidden">
    <div class="topbar">
      <button class="icon-btn" id="exitBtn" aria-label="Salir">✕</button>
      <div class="modes" id="modeRow"></div>
      <div style="width:48px"></div>
    </div>

    <div class="stage">
      <div class="frame" id="frame">
        <video id="video" playsinline muted autoplay></video>
        <div id="props"></div>
        <div id="shots"></div>
        <div id="overlay"></div>
      </div>
    </div>

    <div class="controls">
      <div class="control-stack">
        <div class="row" id="filterRow"></div>
        <div class="tray-head" id="propCats"></div>
        <div class="row" id="propRow"></div>
        <div class="hint">Arrastra para mover · pellizca para crecer · toca dos veces para quitar</div>
      </div>
      <button class="btn primary huge" id="shootBtn" style="flex:0 0 auto">
        <span id="shootLabel">¡Foto!<span class="sub">Shoot</span></span>
      </button>
    </div>
  </section>

  <section id="review" class="screen hidden">
    <div class="result-pane">
      <h2>¡Quedó preciosa!</h2>
      <p class="sub">Looking gorgeous</p>
      <img id="resultImg" alt="Tu foto">
    </div>
    <div class="action-pane" id="actionPane"></div>
  </section>

  <div id="printArea"><img id="printImg" alt=""></div>
  <div id="toast"></div>
  <div id="hotcorner"></div>

  <div class="modal hidden" id="pinModal">
    <div class="sheet" style="max-width:360px">
      <h2>🔒 Ajustes de la cabina</h2>
      <label>PIN <input type="password" inputmode="numeric" id="pinInput" style="width:130px"></label>
      <p class="note" id="pinError" style="color:#ff8fb0; display:none">PIN incorrecto</p>
      <div class="sheet-actions">
        <button class="btn" id="pinCancel">Cancelar</button>
        <button class="btn primary" id="pinOk">Entrar</button>
      </div>
    </div>
  </div>

  <div class="modal hidden" id="adminModal">
    <div class="sheet">
      <h2>Ajustes de la cabina</h2>
      <div id="adminBody"></div>
      <div class="sheet-actions">
        <button class="btn" id="adminReset">Restablecer</button>
        <button class="btn primary" id="adminDone">Listo</button>
      </div>
    </div>
  </div>
</div>

<script src="gif.js"></script>
<script src="booth.js"></script>
</body>
</html>
