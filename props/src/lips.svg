<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" width="520" height="520">
  <defs>
    <linearGradient id="stick2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B98A4E"/>
      <stop offset=".4" stop-color="#E4C08A"/>
      <stop offset="1" stop-color="#9C6F38"/>
    </linearGradient>
    <linearGradient id="lipTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C41236"/>
      <stop offset="1" stop-color="#8E0724"/>
    </linearGradient>
    <linearGradient id="lipBot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0335C"/>
      <stop offset=".6" stop-color="#D01338"/>
      <stop offset="1" stop-color="#8E0724"/>
    </linearGradient>
  </defs>

  <rect x="240" y="230" width="40" height="290" rx="18" fill="url(#stick2)" stroke="#7B5626" stroke-width="4"/>

  <!-- upper lip: two peaks with a cupid's bow -->
  <path fill="url(#lipTop)" d="
    M40 196
    q54 -86 120 -78 q68 8 100 54 q32 -46 100 -54 q66 -8 120 78
    q-92 -30 -220 26 q-128 -56 -220 -26 Z"/>

  <!-- lower lip -->
  <path fill="url(#lipBot)" d="
    M40 196 q92 -30 220 26 q128 -56 220 -26
    q-24 132 -220 156 q-196 -24 -220 -156 Z"/>

  <!-- parting line -->
  <path fill="none" stroke="#6B0518" stroke-width="7" stroke-linecap="round"
        d="M40 196 q92 -30 220 26 q128 -56 220 -26"/>

  <!-- gloss -->
  <ellipse cx="184" cy="262" rx="52" ry="19" fill="#ffffff" opacity=".34" transform="rotate(-11 184 262)"/>
  <ellipse cx="344" cy="268" rx="30" ry="12" fill="#ffffff" opacity=".22" transform="rotate(9 344 268)"/>
</svg>
