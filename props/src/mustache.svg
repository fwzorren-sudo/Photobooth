<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="stick" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B98A4E"/>
      <stop offset=".4" stop-color="#E4C08A"/>
      <stop offset="1" stop-color="#9C6F38"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A3524"/>
      <stop offset=".45" stop-color="#28190F"/>
      <stop offset="1" stop-color="#140C07"/>
    </linearGradient>
    <!-- half a handlebar; mirrored for the other side so both curls match -->
    <path id="half" d="
      M320 84
      C 266 48, 192 30, 136 40
      C 58 54, 12 120, 32 188
      C 46 236, 96 260, 134 246
      C 90 238, 66 204, 76 166
      C 88 116, 142 92, 196 106
      C 252 120, 294 156, 316 180
      L 320 180 Z"/>
  </defs>

  <rect x="300" y="150" width="40" height="250" rx="18" fill="url(#stick)" stroke="#7B5626" stroke-width="4"/>

  <g fill="url(#hair)">
    <use href="#half"/>
    <use href="#half" transform="translate(640,0) scale(-1,1)"/>
  </g>

  <!-- a lighter comb along the top so it does not read as a flat silhouette -->
  <g fill="none" stroke="#6B4F35" stroke-width="7" stroke-linecap="round" opacity=".55">
    <path d="M300 100 C 250 68, 186 54, 140 62"/>
    <path d="M340 100 C 390 68, 454 54, 500 62"/>
    <path d="M96 106 C 60 128, 44 162, 50 192"/>
    <path d="M544 106 C 580 128, 596 162, 590 192"/>
  </g>
</svg>
