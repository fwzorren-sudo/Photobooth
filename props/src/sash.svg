<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300">
  <defs>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB8D2"/>
      <stop offset=".4" stop-color="#EE5C93"/>
      <stop offset="1" stop-color="#B02A62"/>
    </linearGradient>
    <linearGradient id="ribbonDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C13B72"/>
      <stop offset="1" stop-color="#83184A"/>
    </linearGradient>
  </defs>

  <!-- swallow-tailed ends, tucked behind the banner -->
  <path fill="url(#ribbonDark)" d="M40 92 L150 92 L150 232 L40 232 L86 162 Z"/>
  <path fill="url(#ribbonDark)" d="M720 92 L610 92 L610 232 L720 232 L674 162 Z"/>

  <!-- the banner -->
  <path fill="url(#ribbon)" d="M120 62 q260 -34 520 0 l0 200 q-260 34 -520 0 Z"/>

  <!-- gold edging -->
  <g fill="none" stroke="#E8C25E" stroke-width="7">
    <path d="M128 78 q256 -32 504 0"/>
    <path d="M128 246 q256 32 504 0"/>
  </g>

  <text x="380" y="190" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="700"
        fill="#FFF4E2" stroke="#8E1B4E" stroke-width="3" letter-spacing="2">MIS QUINCE</text>

  <!-- sheen -->
  <path fill="#ffffff" opacity=".18" d="M120 62 q260 -34 520 0 l0 44 q-260 -32 -520 0 Z"/>
</svg>
